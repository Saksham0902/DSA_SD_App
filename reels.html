let MX=null;
function buildMX(){const docs=KB.filter(e=>e.k==='prob'||(e.k==='cur'&&e.cat==='DSA problems')).map(e=>{const F=Object.create(null);

    put(e.t,4);put([e.ask||''].concat((e.q||[]).filter(q=>!/^(how to solve|leetcode|lc )/i.test(q)&&!/ (approach|solution)$/i.test(q)&&q!==e.t)).join(' '),3);
    put(e.w||'',2);put(plainText((e.h||'')+' '+(e.a||''))+' '+(e.mx||''),1);return{e,F}});
  const df=Object.create(null);for(const d of docs)for(const t in d.F)df[t]=(df[t]||0)+1;

function match(text,n=3){if(!IDX)return[];if(!MX)buildMX();const raw=String(text||'').slice(0,4000);
  const qt=[...new Set(qToks(raw))].filter(t=>MX.idf[t]>0);const tot=qt.reduce((a,t)=>a+MX.idf[t],0)||1;
  const nm=raw.match(/(?:\b(?:lc|leetcode|problem)\s*#?\s*(\d{1,4})\b)|^\s*#?(\d{1,4})\.?\s/i);const num=nm?+(nm[1]||nm[2]):null;const qn=' '+norm(raw)+' ';const short=qn.trim().split(' ').length<=12;
  const res=[];for(const d of MX.docs){let s=0;const hit=[];
    for(const t of qt){const w=d.F[t];if(w){const v=MX.idf[t]*w;s+=v;hit.push([t,v])}}
    if(num!=null&&d.e.n===num)s+=60;const tn=norm(d.e.t);if(short&&tn.length>3&&qn.includes(' '+tn+' '))s+=4+tn.split(' ').length;

    if(s>0)res.push({e:d.e,s,hit:hit.sort((a,b)=>b[1]-a[1]).slice(0,6).map(h=>h[0])})}

function mdLite(src){const lines=String(src).split('\n');let out='',i=0;

  while(i<lines.length){const l=lines[i];
    if(/^```/.test(l)){const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);i++;out+=`<pre class="ap-pre">${esc(buf.join('\n'))}<\/pre>`;continue}
    if(/^\s*[-*•] /.test(l)){let items='';while(i<lines.length&&/^\s*[-*•] /.test(lines[i]))items+=`<li>${inl(lines[i++].replace(/^\s*[-*•] /,''))}<\/li>`;out+=`<ul>${items}<\/ul>`;continue}
    if(/^\s*\d+[.)] /.test(l)){let items='';while(i<lines.length&&/^\s*\d+[.)] /.test(lines[i]))items+=`<li>${inl(lines[i++].replace(/^\s*\d+[.)] /,''))}<\/li>`;out+=`<ol>${items}<\/ol>`;continue}
    if(/^#{1,4} /.test(l)){out+=`<p><b>${inl(l.replace(/^#+ /,''))}<\/b><\/p>`;i++;continue}
    if(!l.trim()){i++;continue}
    const buf=[];while(i<lines.length&&lines[i].trim()&&!/^(```|\s*[-*•] |\s*\d+[.)] |#{1,4} )/.test(lines[i]))buf.push(lines[i++]);out+=`<p>${inl(buf.join(' '))}<\/p>`}

  if(top){const after=top.querySelector('.pask-hbtn')||top.querySelector('.saved-btn,#svTop,.sv-top');if(after){if(after.nextElementSibling!==b)after.after(b)}else if(b.parentElement!==top)top.appendChild(b);b.classList.remove('float')}
  else if(!b.isConnected){b.classList.add('float');document.body.appendChild(b)}}
if(mq.addEventListener)mq.addEventListener('change',()=>document.querySelectorAll('.thm-btn').forEach(paint));
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
setTimeout(mount,700);setTimeout(mount,2100);
window.DojoTheme={set,get:eff}})();</script><!--thm-end-->
</body></html>
